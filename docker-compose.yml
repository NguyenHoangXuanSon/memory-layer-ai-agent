version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agent_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=rag_agent_db
    volumes:
      - ./docker_data:/var/lib/postgresql/data
    restart: always

